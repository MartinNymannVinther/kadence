# pgBackRest for Kadence (docs/adr/0089, docs/deploy.md §7).
#
# Only what is the same on every installation lives here. Where the
# repository is and the keys to it come from the environment, which
# pgBackRest reads as PGBACKREST_<OPTION> and lets win over this file:
# docker-compose.backup.yml maps S3_BACKUP_* and PGBACKREST_REPO_CIPHER_PASS
# onto them, and refuses to start without every one. Nothing secret, and
# no bucket, is ever written into the repository.

[global]
# An S3-compatible bucket in the EU: Hetzner Object Storage in Falkenstein
# or Nuremberg (docs/subprocessors.md). Bucket, endpoint, region and keys
# from the environment.
repo1-type=s3
repo1-path=/kadence

# Encrypted on the server before it is sent, with a passphrase only the
# server and Martin's password manager hold. The bucket sees ciphertext.
repo1-cipher-type=aes-256-cbc

# Thirty days, as the terms promise. Time-based retention keeps the
# newest full backup older than the window so that every minute inside
# it can be restored; with 29 here that oldest backup is at most thirty
# days old, so nothing deleted in Kadence outlives the promise. The WAL
# goes with the backups it belongs to.
repo1-retention-full-type=time
repo1-retention-full=29

compress-type=zst
compress-level=3
process-max=2
# A checkpoint now rather than whenever Postgres would have taken one:
# the nightly backup starts when it is told to.
start-fast=y

# docker logs is where everything is read (docs/deploy.md §7b).
log-level-console=info
log-level-stderr=off
log-level-file=off

# Postgres runs archive-push once a minute or more; its log line is the
# database's log line, so only what went wrong is said there.
[global:archive-push]
log-level-console=warn

[kadence]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-port=5432
pg1-user=postgres
