# Secrets scanning configuration.
#
# Findings that are not secrets are allowlisted here by value, not by commit
# fingerprint: patches are rebased and cherry-picked, which gives every
# commit a new hash, and an allowlist keyed on a hash silently stops working
# the moment history is rewritten. Matching the literal value keeps working
# and stays narrow.
#
# Every entry must be justified in a comment. If you cannot say in one
# sentence why a value is harmless, it is not harmless: rotate it instead of
# adding it here.

[extend]
useDefault = true

# A rider's upload key (docs/adr/0029): `kad_` and 32 random bytes. The
# prefix is there so that a key pasted into a file is found; the default
# rules know nothing of it.
[[rules]]
id = "kadence-upload-key"
description = "Kadence upload key"
regex = '''\bkad_[A-Za-z0-9_-]{43}'''
keywords = ["kad_"]

[allowlist]
description = "Values that look like secrets but never were"
regexTarget = "match"
regexes = [
  # A test fixture. This placeholder BETTER_AUTH_SECRET existed only to
  # satisfy the env schema's 16-character minimum in the signup-gate test,
  # was never deployed anywhere, and has since been replaced by a
  # self-describing low-entropy string. It remains in the git history.
  '''0123456789abcdef0123456789abcdef''',
  # The names of DCU's strength programmes in the library
  # (src/modules/dcu/strength.ts, and the demo that looks one up): an
  # identifier a person wrote, not a credential, which the default
  # generic-api-key rule reads as one because it follows `key:`.
  '''dcu-strength-u(17|19|23)-2016''',
]
