version: 2

# Kadence promises a 90-day fix window in SECURITY.md. That promise needs a
# mechanism, not good intentions: this is it. The github-actions ecosystem
# keeps the workflow's pinned commits current: the actions are pinned to
# SHAs, so without this they would stay where they were pinned forever.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Better Auth is pinned on purpose (pnpm-workspace.yaml): the three
    # packages move together, and since 1.7.3 Better Auth refuses every
    # request when the schema disagrees with it, so a bump is tried with a
    # real login (docs/adr/0111), not a pull request read on a Monday.
    # Security advisories against it still arrive; version bumps do not.
    ignore:
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@better-auth/core"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@better-auth/passkey"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # One PR for the routine patch traffic; anything that changes a
      # major version still arrives on its own and gets read properly.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
