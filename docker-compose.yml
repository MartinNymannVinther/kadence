# Production compose for Kadence, designed to be run by Coolify on an EU VPS.
# See docs/deploy.md. All secrets come from the environment (Coolify UI);
# nothing here has a real default.
#
# The text after `:?` is compose's error when a variable is missing. Know
# that Coolify reads this file to pre-create the resource's variables and
# puts that text in as each one's VALUE. Every `set ...` you see in
# Coolify's variable list must be replaced before the first deploy; the
# migration step and the app both refuse to run on one, and say so.

# Docker's default json-file driver keeps every line forever; on a long-
# running VPS that fills the disk under the database before anything else
# notices. The same three lines on every service cap it at 100 MB total
# (20 MB × 5 files), rotated rather than dropped, which is plenty for
# `docker logs` and for Coolify's log viewer (docs/deploy.md §Overvågning).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -hex 24)}
      POSTGRES_DB: kadence
      KADENCE_APP_PASSWORD: ${KADENCE_APP_PASSWORD:?set KADENCE_APP_PASSWORD (openssl rand -hex 24)}
      KADENCE_AUTH_PASSWORD: ${KADENCE_AUTH_PASSWORD:?set KADENCE_AUTH_PASSWORD (openssl rand -hex 24)}
    volumes:
      - kadence-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kadence"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/kadence
      # The migration step is what gives the runtime roles their login
      # rights: the Postgres init directory is bind-mounted from the
      # repository and is empty on a build system that cleans up after
      # itself. Learned the hard way on the first deploy.
      KADENCE_APP_PASSWORD: ${KADENCE_APP_PASSWORD:?}
      KADENCE_AUTH_PASSWORD: ${KADENCE_AUTH_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  app:
    build:
      context: .
      target: runner
      args:
        # Coolify and any CI runner should pass these so the running app can
        # name the code it was built from. Unset means "unknown", not a lie.
        KADENCE_COMMIT: ${KADENCE_COMMIT:-}
        KADENCE_BUILT_AT: ${KADENCE_BUILT_AT:-}
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgres://kadence_app:${KADENCE_APP_PASSWORD:?}@db:5432/kadence
      AUTH_DATABASE_URL: postgres://kadence_auth:${KADENCE_AUTH_PASSWORD:?}@db:5432/kadence
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL, e.g. https://kadence.haij.dk}
      # Everything optional, forwarded explicitly.
      #
      # A variable set in Coolify reaches this file for `${...}`
      # substitution; it does not reach the container unless it is named
      # here. Until it was, setting LLM_PROVIDER and MISTRAL_API_KEY in
      # the panel did nothing at all: the app started, defaulted to no
      # model, and every AI button quietly said there was none. A
      # deployment that ignores half its own configuration without saying
      # so is worse than one that refuses to start.
      #
      # `:-` leaves an unset variable as the empty string, and env.ts
      # reads an empty string as absent, so an unset variable here is the
      # same thing as no variable at all.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      SIGNUP: ${SIGNUP:-}
      DEMO: ${DEMO:-}
      # Races from Cykling Danmark (ADR 0039), off unless set.
      DCU_RESULTS: ${DCU_RESULTS:-}
      # The parts an installation may park (docs/adr/0057), each on
      # unless set to "off".
      RULLE_WORLD: ${RULLE_WORLD:-}
      COACHES_ROOM: ${COACHES_ROOM:-}
      CLUB_CHAMPIONSHIP: ${CLUB_CHAMPIONSHIP:-}
      CALC_ENERGY: ${CALC_ENERGY:-}
      GUIDE_FOOD: ${GUIDE_FOOD:-}
      GUIDE_TEAMS: ${GUIDE_TEAMS:-}
      # The teams page (ADR 0072): whether Cykling Danmark is read. What
      # was read is kept in the kadence-teams volume below.
      TEAMS_DCU: ${TEAMS_DCU:-}
      TEAMS_DIR: /data/teams
      # Reminders by web push (docs/adr/0060); nothing is sent without the
      # key pair. The private key is a secret: Coolify only.
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      # The installation's own roof over model calls (docs/adr/0035). An
      # unset variable is the empty string here and absent to env.ts, so
      # it falls back to the default rather than being read as `0` — and
      # `0`, which means no roof at all, still reaches the app as `0`.
      AI_DAILY_CALL_CAP: ${AI_DAILY_CALL_CAP:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      # Wahoo, Garmin and Polar, for riders who choose to connect
      # (.env.example, docs/devices-setup.md).
      WAHOO_CLIENT_ID: ${WAHOO_CLIENT_ID:-}
      WAHOO_CLIENT_SECRET: ${WAHOO_CLIENT_SECRET:-}
      WAHOO_WEBHOOK_TOKEN: ${WAHOO_WEBHOOK_TOKEN:-}
      GARMIN_CLIENT_ID: ${GARMIN_CLIENT_ID:-}
      GARMIN_CLIENT_SECRET: ${GARMIN_CLIENT_SECRET:-}
      POLAR_CLIENT_ID: ${POLAR_CLIENT_ID:-}
      POLAR_CLIENT_SECRET: ${POLAR_CLIENT_SECRET:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      # The map behind routes, served by Kadence itself (ADR 0023). Empty
      # until `docker compose --profile map run --rm map` has fetched it;
      # without it routes are drawn on plain paper.
      MAP_FILE: /data/map/denmark.pmtiles
    volumes:
      - kadence-map:/data/map:ro
      - kadence-teams:/data/teams
    logging: *default-logging
    # No published port. Coolify's proxy reaches the app over the compose
    # network and terminates TLS in front of it; binding 0.0.0.0:3000 as
    # well would put the same app on the VPS's public address in cleartext,
    # outside the proxy, its TLS and its HSTS. Anyone running this without
    # a proxy should bind loopback explicitly and put one in front.
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Fetches the map of Denmark into the kadence-map volume: the
  # OpenStreetMap basemap Protomaps builds daily, cut to Denmark with
  # Protomaps' own tool. Not part of `up`; scripts/fetch-map.sh runs it
  # with the newest build, and again to refresh the map (docs/deploy.md).
  map:
    image: protomaps/go-pmtiles:latest
    profiles: ["map"]
    command:
      - extract
      - https://build.protomaps.com/${MAP_BUILD:-missing}.pmtiles
      - /data/map/denmark.pmtiles
      - --bbox=7.7,54.5,15.4,57.9
      - --maxzoom=14
    volumes:
      - kadence-map:/data/map

volumes:
  kadence-pgdata:
  kadence-map:
  kadence-teams:
