# pnpm 10 reads its settings from here rather than from a "pnpm" field in
# package.json, and it ignores that field silently apart from one warning
# on install. The overrides below were in the wrong place until the
# pre-release review: the pins survived in the lockfile, so nothing was
# broken, but the next regenerated lockfile would have dropped them
# without anybody deciding to.
#
# sharp reaches production through next and esbuild through drizzle-kit;
# both had advisories their own maintainers had not yet released past.
overrides:
  sharp: ">=0.35.4"
  esbuild: ">=0.25.0"
  # pptxgenjs pins image-size 1.x, which has two denial-of-service
  # advisories in its ICNS, JXL and HEIF parsers (GHSA-w3rx-r6r6-pgpr,
  # GHSA-5p2g-fcmc-qvqq); the fix landed in 2.0.3. Kadence never puts an
  # image on a slide, so the parsers are never reached, but a required
  # audit gate that is red for a path nobody takes is a gate people learn
  # to ignore. The buffer API pptxgenjs would call is the same in 2.x.
  image-size: ">=2.0.3"

# Not an override: the Better Auth family is pinned to one exact version
# in package.json — including @better-auth/core as a direct exact
# dependency, because the passkey plugin takes core as a *peer* and
# pnpm resolves auto-installed peers to the root's own version, never
# to an override. The three move together or not at all. Since 1.7.3
# Better Auth checks the schema it is given and refuses every request
# when it disagrees, so a bump is read against its release notes and
# tried with a real login first (drizzle/0059, docs/adr/0111).

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
